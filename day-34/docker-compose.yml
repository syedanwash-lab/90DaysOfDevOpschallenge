version: '3.8'

services:
  web-app:
    build: ./app
    ports:
      - "5000:5000"
    environment:
      - POSTGRES_USER=devops_user
      - POSTGRES_PASSWORD=securepassword
      - POSTGRES_DB=devops_db

    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
    networks:
      - app-network
    labels:
      tier: frontend
      project: day-34-challenge

  postgres-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=devops_user
      - POSTGRES_PASSWORD=securepassword
      - POSTGRES_DB=devops_db
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL" , "pg_isready -U devops_user -d devops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    labels:
      tier: backend-db
      project: day-34-challenge

  redis-cache:
    image: redis:7-alpine
    restart: on-failure
    networks:
      - app-network
    labels:
      tier: backend-cache
      project: day-34-challenge

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
